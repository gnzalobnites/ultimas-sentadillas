<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Últimas sentadillas</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <div class="titulo">Últimas sentadillas</div>
    
    <div id="fechaContainer" class="fecha-container"></div>
    
    <div class="contenedor-principal">
        <div class="tabla-container" id="tablaContainer">
            <table id="tablaSeries">
                <tbody>
                    <!-- Las filas se agregarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
        
        <div class="cronometro-container">
            <div id="cronometro">00:00:00</div>
            <div style="font-size: 1em; margin-top: 5px; color: #666;">Tiempo de descanso</div>
        </div>
        
        <div class="gif-container" id="gifContainer">
            <img src="media/sentadilla.gif" alt="Persona haciendo una sentadilla con técnica correcta" />
            <div class="gif-texto">
                 Técnica correcta de sentadilla
                <span class="gif-texto-separador">Espalda recta • Rodillas alineadas • Pies firmes</span>
            </div>
        </div>
    </div>
    
    <div class="botones-container">
        <button 
            class="boton boton-borrar" 
            aria-label="Borrar todas las series registradas"
            onclick="borrarDatos()"
        >
            Borrar
        </button>
        <button 
            class="boton boton-registrar" 
            aria-label="Registrar nueva serie"
            onclick="registrarSerie()"
        >
            Registrar
        </button>
    </div>

    <footer>
        <div>¿Tienes sugerencias? Escríbeme a 
            <a href="mailto:benitesgonzalogaston@gmail.com">benitesgonzalogaston@gmail.com</a>
        </div>
        <div>¿Te sirve esta herramienta? 
            <a href="https://www.buymeacoffee.com/gnzbenitesh" target="_blank"> Invítame un café</a>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
